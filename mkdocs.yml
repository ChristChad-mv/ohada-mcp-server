site_name: OHADA MCP Documentation
site_description: Independent MCP infrastructure for structured OHADA legal information
site_author: Christ Chad
repo_name: ohada-mcp
theme:
  name: material
  language: fr
  features:
    - navigation.instant
    - navigation.sections
