site_name: OHADA MCP
site_url: https://christchad-mv.github.io/ohada-mcp-server/
site_description: Documentation du serveur MCP public pour le droit OHADA et le SYSCOHADA
site_author: Christ Chad
repo_url: https://github.com/ChristChad-mv/ohada-mcp-server
repo_name: ChristChad-mv/ohada-mcp-server
edit_uri: edit/master/docs/

theme:
  name: material
  language: fr
  icon:
    logo: material/scale-balance
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Passer au thème sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Passer au thème clair
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

nav:
  - Bienvenue:
      - Vue d'ensemble: index.md
      - Démarrage rapide: quickstart.md
  - Connexion:
      - Connecter Claude: integrations/claude.md
      - Intégration Python: integrations/python.md
      - Protocole et endpoint: integrations/protocol.md
  - Outils disponibles:
      - Choisir un outil: tools.md
      - Outils juridiques: tools/legal.md
      - Outils SYSCOHADA: tools/syscohada.md
      - Enchaînements recommandés: workflows.md
  - Données et réponses:
      - Textes couverts: corpus.md
      - Formats de réponse: responses.md
      - Limites et erreurs: limits.md
  - Confiance:
      - Confidentialité: privacy.md
      - Sécurité: security.md
      - Questions fréquentes: faq.md

plugins:
  - search:
      lang: fr

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

copyright: Projet indépendant créé par Christ Chad · Licence MIT
