name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --extra dev
      - name: Verify production dependency export
        run: uv export --frozen --no-dev --no-emit-project --no-header --format requirements.txt | diff - requirements-prod.txt
      - name: Test
        run: uv run pytest -q

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --extra dev --extra docs
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Build documentation
        run: uv run mkdocs build --strict
      - name: Build package
        run: uv build
