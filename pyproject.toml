[project]
name = "ohada-mcp"
version = "1.0.0"
description = "OHADA MCP Server — open Model Context Protocol infrastructure for OHADA law and SYSCOHADA"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Christ Chadrak Mvoungou" },
]
keywords = [
    "OHADA",
    "SYSCOHADA",
    "MCP",
    "Model Context Protocol",
    "legaltech",
    "legal AI",
    "African business law",
]
dependencies = [
    "mcp>=1.28.1,<2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.25.0",
]

[project.urls]
Documentation = "https://christchad-mv.github.io/ohada-mcp-server/"
Repository = "https://github.com/ChristChad-mv/ohada-mcp-server"

[project.scripts]
ohada-mcp = "ohada_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]
docs = [
    "mkdocs-material>=9.5.0",
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
